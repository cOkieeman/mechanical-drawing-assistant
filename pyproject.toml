[project]
name = "mechanical-drawing-assistant"
version = "0.1.0"
description = "Local assistant for mechanical drawing generation, annotation planning, and review."
readme = "README.md"
authors = [
    { name = "cOkieeman", email = "849715912@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ezdxf>=1.4.4",
    "mcp>=1.28.1",
    "pywin32>=312",
]

[project.scripts]
mda = "mechanical_drawing_assistant.cli:main"
mda-mcp = "mechanical_drawing_assistant.mcp_server:main"
mechanical-drawing-assistant = "mechanical_drawing_assistant.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.14.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
